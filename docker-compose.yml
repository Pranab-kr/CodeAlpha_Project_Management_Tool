services:
  db:
    image: postgres:18-alpine
    container_name: teamboard-db
    environment:
      POSTGRES_USER: teamboard
      POSTGRES_PASSWORD: teamboard
      POSTGRES_DB: teamboard
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker;
      # mounting the parent lets pg_upgrade work and avoids the 18+ guard error.
      - teamboard_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamboard -d teamboard"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  teamboard_pgdata:
