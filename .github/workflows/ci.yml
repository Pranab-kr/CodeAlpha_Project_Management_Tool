name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codealpha
          POSTGRES_PASSWORD: codealpha
          POSTGRES_DB: codealpha
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U codealpha -d codealpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://codealpha:codealpha@localhost:5432/codealpha
      TEST_DATABASE_URL: postgres://codealpha:codealpha@localhost:5432/codealpha_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      COOKIE_SECURE: "false"
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        run: >-
          PGPASSWORD=codealpha psql -h localhost -U codealpha -d postgres
          -c 'CREATE DATABASE codealpha_test;'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
